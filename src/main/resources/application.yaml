spring:
  application:
    name: spring-event-notifications
  datasource:
    url: jdbc:h2:mem:event-notifications;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

logging:
  level:
    com.event.notifications: INFO

server:
  port: ${SERVER_PORT:8080}

app:
  notifications:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@example.test}
    from-name: ${MAIL_FROM_NAME:Spring Event Notifications}
    mailtrap-token: ${MAILTRAP_API_TOKEN:}
    sandbox: ${MAILTRAP_SANDBOX:false}
    inbox-id: ${MAILTRAP_INBOX_ID:0}
    digest-window-days: ${DIGEST_WINDOW_DAYS:7}
    digest-cron: ${DIGEST_CRON:0 0 9 * * MON}
    digest-zone: ${DIGEST_ZONE:Europe/Kiev}
    templates:
      teammate-invited: ${MAILTRAP_TEMPLATE_TEAMMATE_INVITED:}
      task-assigned: ${MAILTRAP_TEMPLATE_TASK_ASSIGNED:}
      comment-posted: ${MAILTRAP_TEMPLATE_COMMENT_POSTED:}
      weekly-digest: ${MAILTRAP_TEMPLATE_WEEKLY_DIGEST:}

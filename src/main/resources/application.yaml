spring:
  application:
    name: spring-event-notifications
  datasource:
    url: jdbc:h2:mem:event-notifications;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

logging:
  level:
    com.event.notifications: INFO

app:
  notifications:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@example.test}
    from-name: ${MAIL_FROM_NAME:Spring Event Notifications}
    mailtrap-token: ${MAILTRAP_API_TOKEN:e3c23a3db7d893f8f1cb2d644ab855f3}
    sandbox: ${MAILTRAP_SANDBOX:true}
    inbox-id: ${MAILTRAP_INBOX_ID:2844716}
    digest-window-days: ${DIGEST_WINDOW_DAYS:7}
    digest-cron: ${DIGEST_CRON:0 0 9 * * MON}
    digest-zone: ${DIGEST_ZONE:Europe/Kiev}
    templates:
      teammate-invited: ${MAILTRAP_TEMPLATE_TEAMMATE_INVITED:8d367b93-ad9c-4ca6-b053-de33b1ba983e}
      task-assigned: ${MAILTRAP_TEMPLATE_TASK_ASSIGNED:ec2b479f-27ca-4a97-8a86-53ecac22deb2}
      comment-posted: ${MAILTRAP_TEMPLATE_COMMENT_POSTED:67afb52b-5693-464d-bcca-79bab5fab044}
      weekly-digest: ${MAILTRAP_TEMPLATE_WEEKLY_DIGEST:c4287ec2-9289-4f9f-bdee-8c9939b425f8}
server:
  port: 9999
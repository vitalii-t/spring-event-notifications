<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="page">
    <section class="hero">
        <div>
            <p class="eyebrow">404</p>
            <h1>That page does not exist.</h1>
            <p class="lede">The address you opened is not part of this application. Use the dashboard to trigger events, inspect seed data, or run the digest manually.</p>
            <a class="button-link" href="/">Go to dashboard</a>
        </div>
        <div class="hero-card">
            <div class="metric">
                <span>/</span>
                <small>Home</small>
            </div>
            <div class="metric">
                <span>/api</span>
                <small>API base</small>
            </div>
        </div>
    </section>
</main>
</body>
</html>
